name: Deploy Staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout matching revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_SSH_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Prepare deploy files
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          printf '%s' "$STAGING_ENV_FILE" > .staging.env.runtime
          cat > .staging.deploy.env <<EOF
          APP_NAME=canva-schedule
          DEPLOY_ENV=staging
          APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/canva-schedule
          IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
          APP_PORT=3001
          APP_RUNTIME_ENV_FILE=/opt/canva-schedule/staging/.env.runtime
          PROJECT_ROOT=/opt/canva-schedule/staging
          GHCR_USERNAME=${GHCR_PULL_USERNAME}
          GHCR_TOKEN=${GHCR_PULL_TOKEN}
          EOF

      - name: Upload deploy bundle
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          ssh -p "${VPS_SSH_PORT:-22}" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/canva-schedule/staging/scripts"
          scp -P "${VPS_SSH_PORT:-22}" deploy/compose.yml "$VPS_USER@$VPS_HOST:/opt/canva-schedule/staging/compose.yml"
          scp -P "${VPS_SSH_PORT:-22}" deploy/scripts/deploy.sh "$VPS_USER@$VPS_HOST:/opt/canva-schedule/staging/scripts/deploy.sh"
          scp -P "${VPS_SSH_PORT:-22}" deploy/scripts/smoke-check.sh "$VPS_USER@$VPS_HOST:/opt/canva-schedule/staging/scripts/smoke-check.sh"
          scp -P "${VPS_SSH_PORT:-22}" deploy/scripts/rollback.sh "$VPS_USER@$VPS_HOST:/opt/canva-schedule/staging/scripts/rollback.sh"
          scp -P "${VPS_SSH_PORT:-22}" .staging.env.runtime "$VPS_USER@$VPS_HOST:/opt/canva-schedule/staging/.env.runtime"
          scp -P "${VPS_SSH_PORT:-22}" .staging.deploy.env "$VPS_USER@$VPS_HOST:/opt/canva-schedule/staging/.deploy.env"
          ssh -p "${VPS_SSH_PORT:-22}" "$VPS_USER@$VPS_HOST" "chmod 600 /opt/canva-schedule/staging/.env.runtime /opt/canva-schedule/staging/.deploy.env && chmod 700 /opt/canva-schedule/staging/scripts/*.sh"

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          ssh -p "${VPS_SSH_PORT:-22}" "$VPS_USER@$VPS_HOST" "bash -lc 'set -euo pipefail; cd /opt/canva-schedule/staging && trap \"rm -f ./.deploy.env\" EXIT && set -a && source ./.deploy.env && set +a && bash ./scripts/deploy.sh'"
