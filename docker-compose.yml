services:
  db:
    image: postgres:16-alpine
    container_name: siletravel-db
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: siletravel
      POSTGRES_PASSWORD: siletravel_dev
      POSTGRES_DB: siletravel
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
